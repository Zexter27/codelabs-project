<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code-Coffee</title>

    

    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    
    <!-- encabezado -->
    <header class="cabecera">
        <div class="bienvenido">
            <h2>BIENVENIDO AL CAFE</h2>
        
        </div>
    </header>


    <!-- navegacion -->

    <section class="cafes">
        <h4>CAFES</h4>
    </section>
    <section class="salado">
        <h4>SALADO</h4>
    </section>
    <section class="dulce">
        <h4>DULCE</h4>
    </section>

    <!--contacto-->
    <section class="contacto">
        <h2>CONTACTO</h2>

        <form id="formulario">
            <label>Nombre:</label>
            <input type="text" id="nombre">

            <label>Correo:</label>
            <input type="text" id="correo">

            <label>Mensaje:</label>
            <input type="text" id="mensaje">

            <button type="submit">Enviar</button>
        </form>
        <p id ="respuesta"></p>
    </section>


    <!-- pie de pagina -->

    <footer class="footer">
        <p> &copy; derechos reservados a ...</p>
    </footer>
    <script src ="script.js"></script>
</body>
</html>
