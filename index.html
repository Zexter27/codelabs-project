<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code-Coffee</title>

    

    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    
    <!-- encabezado -->
    <header class="cabecera">
        <nav>
            <a href="#">Inicio</a>
            <a href="#cafes">Cafés</a>
            <a href="#salado">Salado</a>
            <a href="#dulce">Dulce</a>
        </nav>
    </header>

    <div class="bienvenido">
        <h2>BIENVENIDO AL CAFÉ</h2>
        <p>Disfruta de los mejores productos</p>
    </div>


    <div class="Salado">
        <h2>SALADO</h2>
        <ul>
            <li>Croissants</li>
        </ul>
        <img class="Croissants" src="img/Croissants1.jpg" alt="Croissants">


        <ul>
            <li>Desayunos</li>
        </ul>
        <img class="desayuno" src="img/desayuno.jpg">

        <ul>
            <li>Sandwich</li>
        </ul>
        <img class="sandwich" src="img/sandwich.jpg">
    </div>

    <!--contacto-->
    <section class="contacto">
        <h2>CONTACTO</h2>

        <form id="formulario">
            <label>Nombre:</label>
            <input type="text" id="nombre">

            <label>Correo:</label>
            <input type="text" id="correo">

            <label>Mensaje:</label>
            <input type="text" id="mensaje">

            <button type="submit">Enviar</button>
        </form>
        <p id ="respuesta"></p>
    </section>


    <!-- pie de pagina -->

    <footer class="footer">
        <p> &copy; derechos reservados a ...</p>
    </footer>
    <script src ="script.js"></script>
</body>
</html>
